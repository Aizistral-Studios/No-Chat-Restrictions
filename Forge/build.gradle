buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { url "https://plugins.gradle.org/m2/" }
        gradlePluginPortal()
    }
}

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
    id "com.modrinth.minotaur" version "2.+"
    id "com.matthewprenger.cursegradle" version "1.4.0"
}

version = project.modVersion
group = 'com.aizistral.nochatrestrictions'

// Mojang ships Java 25 to end users in 26.1+, so your mod should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))

minecraft {
    // makeObfSourceJar = false // an Srg named sources jar is made by default. uncomment this to disable.
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
		 configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', 'nochatrestrictions'
			args '--mixin.config=nochatrestrictions.mixins.json'
        }
		
		register('client')

        register('server') {
            args '--nogui'
        }
    }
}

repositories {
	minecraft.mavenizer(it)
	maven fg.forgeMaven
    maven fg.minecraftLibsMaven
	maven {  url = "https://repo.spongepowered.org/maven" }
    mavenCentral()
}

dependencies {
	implementation minecraft.dependency("net.minecraftforge:forge:$minecraft_version-$forge_version")
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
	annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.1'
}

jar {
    manifest {
        attributes([
            "Specification-Title": "NoChatRestrictions",
            "Specification-Vendor": "Aizistral",
            "Specification-Version": project.manifestVersion,
            "Implementation-Title": project.name,
            "Implementation-Version": project.manifestVersion,
            "Implementation-Vendor" :"NoChatRestrictions",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
			"TweakClass": "org.spongepowered.asm.launch.MixinTweaker",
            "TweakOrder": 0,
            "MixinConfigs" : "nochatrestrictions.mixins.json"
        ])
    }
}

jar.finalizedBy('reobfJar')

curseforge {

    project {
        apiKey = findProperty('curseKey') ?: '0'
        
		id = '1442925'
        releaseType = 'release'
        changelogType = 'markdown'
        changelog = file('../CHANGELOG.md')
		
		addGameVersion '1.21.11'
		addGameVersion '1.21.10'
		addGameVersion '1.21.9'
		addGameVersion '1.21.8'
		addGameVersion '1.21.7'
		addGameVersion '1.21.6'
		addGameVersion '1.21.5'
		addGameVersion '1.21.4'
		addGameVersion '1.21.3'
		addGameVersion '1.21.2'
		addGameVersion '1.21.1'
		addGameVersion '1.21'
		addGameVersion 'Forge'
		addGameVersion 'Java 21'
    }
}

modrinth {
    token = findProperty('modrinthKey') ?: '0'
    projectId = "z440MEwJ"
    versionNumber = project.version
	versionName = "No Chat Restrictions " + project.version
    versionType = "release"
	changelog = rootProject.file("../CHANGELOG.md").text
    uploadFile = jar
    gameVersions = [
		'1.21.11', 
		'1.21.10',
		'1.21.9',
		'1.21.8',
		'1.21.7',
		'1.21.6',
		'1.21.5',
		'1.21.4',
		'1.21.3',
		'1.21.2',
		'1.21.1',
		'1.21'
	]
	loaders = [ 'forge' ]
}

task upload {
	dependsOn('modrinth')
	dependsOn('curseforge')
}