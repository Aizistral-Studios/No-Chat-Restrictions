plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
    id "com.modrinth.minotaur" version "2.+"
    id "com.matthewprenger.cursegradle" version "1.4.0"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName
}

curseforge {

    project {
        apiKey = findProperty('curseKey') ?: '0'
        
		id = '1442925'
        releaseType = 'release'
        changelogType = 'markdown'
        changelog = file('../CHANGELOG.md')
		mainArtifact(remapJar)
		
		addGameVersion '1.20.6'
		addGameVersion '1.20.5'
		addGameVersion 'Fabric'
		addGameVersion 'Java 21'
		
		relations {
			requiredDependency 'fabric-api'
		}
    }
}

modrinth {
    token = findProperty('modrinthKey') ?: '0'
    projectId = "z440MEwJ"
    versionNumber = project.version
	versionName = "No Chat Restrictions " + project.version
    versionType = "release"
	changelog = rootProject.file("../CHANGELOG.md").text
    uploadFile = remapJar
    gameVersions = [ '1.20.6', '1.20.5' ]
	loaders = [ 'fabric' ]
    
	dependencies {
		required.project "P7dR8mSH"
    }
}

afterEvaluate {
	tasks.named('modrinth') {
		dependsOn(remapJar)
	}
	tasks.named('curseforge') {
		dependsOn(remapJar)
	}
}

task upload {
	dependsOn('modrinth')
	dependsOn('curseforge')
}