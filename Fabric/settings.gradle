pluginManagement {
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'com.matthewprenger.cursegradle') {
                useModule("com.matthewprenger:CurseGradle:${requested.version}")
            }
        }
    }
	repositories {
		maven { url = uri("${rootDir}/deps") }
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}